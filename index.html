<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Terra Guard V2 — Citizen Safety Companion</title>

    <!-- Favicons in all common sizes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0284C7" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Responsive Viewport with iPhone notch & safe area cover -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" id="meta-theme-color" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Terra Guard V2 — Simplified, mobile-first disaster and flood safety companion for everyday citizens." />

    <!-- Apple iOS Progressive Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Terra Guard" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Apple iOS Touch Startup Splash Screens (prevents white flash on launch) -->
    <!-- iPhone 16 / 15 / 14 Pro (1179px x 2556px, 3x) -->

    <!-- iPhone 16 / 15 / 14 Pro Max (1290px x 2796px, 3x) -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1290-2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone 15 / 14 / 13 / 12 (1170px x 2532px, 3x) -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1170-2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- iPhone SE 3rd/2nd gen, 8, 7 (750px x 1334px, 2x) -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-750-1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPad Pro 12.9" (2048px x 2732px, 2x) -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-2048-2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- iPad Air / 11" (1668px x 2388px, 2x) -->
    <link rel="apple-touch-startup-image" href="/splash/apple-splash-1668-2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- Open Graph & Social Preview -->
    <meta property="og:title" content="Terra Guard V2 — Citizen Disaster Companion" />
    <meta property="og:description" content="Mobile-first, cognitive-de-escalation disaster monitoring and safety companion for everyday citizens." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Terra Guard V2 — Citizen Disaster Companion" />
    <meta name="twitter:description" content="Mobile-first, cognitive-de-escalation disaster monitoring and safety companion for everyday citizens." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Themed First Paint (Runs before React mounts to prevent FOUC) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('terra_guard_theme') || 'terra-classic';
          var validThemes = ['terra-classic', 'monsoon', 'sime-darby'];
          if (validThemes.indexOf(savedTheme) === -1) {
            savedTheme = 'terra-classic';
            try { localStorage.setItem('terra_guard_theme', 'terra-classic'); } catch (err) {}
          }
          var isDark = savedTheme === 'monsoon';
          var themeColors = {
            'terra-classic': '#F8FAFC',
            'monsoon': '#0D1117',
            'sime-darby': '#FFF4DC'
          };
          var root = document.documentElement;
          root.setAttribute('data-theme', savedTheme);
          root.setAttribute('data-theme-mode', isDark ? 'dark' : 'light');
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.getElementById('meta-theme-color');
          if (meta && themeColors[savedTheme]) {
            meta.setAttribute('content', themeColors[savedTheme]);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Typography (display=swap with robust system fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
