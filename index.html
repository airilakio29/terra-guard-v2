<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 4.5c1.38 0 2.5 1.12 2.5 2.5s-1.12 2.5-2.5 2.5S9.5 10.38 9.5 9s1.12-2.5 2.5-2.5zm0 13c-2.33 0-4.32-.93-5.75-2.42.03-1.91 3.83-2.96 5.75-2.96 1.91 0 5.72 1.05 5.75 2.96-1.43 1.49-3.42 2.42-5.75 2.42z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFC" id="meta-theme-color" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Terra Guard V2 — Simplified, mobile-first disaster and flood safety companion for everyday citizens." />

    <!-- Step 4: Themed First Paint (Runs before React mounts to prevent FOUC) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('terra_guard_theme') || 'terra-classic';
          var darkThemes = ['aurora-night', 'monsoon'];
          var isDark = darkThemes.indexOf(savedTheme) !== -1;
          var themeColors = {
            'terra-classic': '#F8FAFC',
            'ocean': '#F0F9FF',
            'forest': '#F2FBF5',
            'neko': '#FFF8F3',
            'sakura': '#FDF2F8',
            'aurora-night': '#0B0F19',
            'sunset-lantern': '#FFFBEB',
            'monsoon': '#0D1117'
          };
          var root = document.documentElement;
          root.setAttribute('data-theme', savedTheme);
          root.setAttribute('data-theme-mode', isDark ? 'dark' : 'light');
          root.style.colorScheme = isDark ? 'dark' : 'light';
          var meta = document.getElementById('meta-theme-color');
          if (meta && themeColors[savedTheme]) {
            meta.setAttribute('content', themeColors[savedTheme]);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Step 3: Typography for all 8 Themes (display=swap with robust system fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <title>Terra Guard V2 — Citizen Safety Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
